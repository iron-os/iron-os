[package]
name = "kiosk-compositor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Wayland kiosk compositor for Iron OS, replaces weston"

[features]
# lets the integration tests inject touch events over the debug socket
test-input = []

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
	"backend_drm",
	"backend_gbm",
	"backend_egl",
	"backend_libinput",
	"backend_udev",
	"backend_session_libseat",
	"renderer_gl",
	"desktop",
	"wayland_frontend",
] }
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[profile.release]
lto = true

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
